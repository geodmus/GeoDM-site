name: Apply GEO Fixes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 scripts/geo_fixes.py
      - name: Commit and push if changed
        run: |
          git config user.name "geo-fixes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "GEO fixes: de-obfuscate emails, bake stat values, clean sitemap" && git push)
